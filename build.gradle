// OFA-SK: a Skript addon for skript-minestom that adds .sk syntax backed by OneForAll
// (menus, events, player data, network variables).
//
// The jar shades OneForAll (OFASK_00 Decision 1); skript-minestom and Minestom stay compileOnly.
plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'net.honormc'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    maven { url = 'https://maven.hapily.me/releases' }  // minestom-sm
    maven { url = 'https://maven.hapily.me/snapshots' } // skript-minestom (releases are published here)
    mavenCentral()
    maven { url = 'https://jitpack.io' }                // OneForAll
    maven { url = 'https://repo.papermc.io/repository/maven-public/' } // Adventure
    maven { url = 'https://maven.conceptmc.com/releases' }             // skript-minestom's LuckPerms
    maven { url = 'https://repo.hypera.dev/snapshots/' }               // skript-minestom's Spark
    maven { url = 'https://repo.kenzie.mx/releases' }                  // mx.kenzie:mirror
    maven { url = 'https://repo.lucko.me/' }                           // LuckPerms API
}

dependencies {
    implementation("com.github.oneforall-mc.oneforall:oneforall-minestom:${oneforallVersion}") {
        exclude group: 'net.kyori'
        exclude group: 'com.google.code.gson'
        exclude group: 'org.slf4j'
    }
    compileOnly "com.github.hapily04.skriptminestom:minestom:${skriptMinestomVersion}"
    compileOnly "net.minestom:minestom-sm:${minestomVersion}"
}

processResources {
    inputs.property 'version', version
    filesMatching('plugin.yml') {
        expand version: version
    }
}

jar {
    archiveClassifier = 'plain'
}

shadowJar {
    archiveClassifier = ''
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/module-info.class', 'module-info.class'
}

tasks.named('assemble') {
    dependsOn shadowJar
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
